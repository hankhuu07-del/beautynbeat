<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cẩm nang làm đẹp | Beauty N Beat</title>

  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/news.css">
</head>

<body class="news-page">
  <!-- Header dùng chung do A phụ trách -->
  <div id="site-header"></div>

  <main class="container py-4 py-md-5">
    <!-- Đường dẫn -->
    <nav aria-label="Đường dẫn" class="mb-4">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a href="index.html">Trang chủ</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">Cẩm nang làm đẹp</li>
      </ol>
    </nav>

    <!-- Banner -->
    <section class="news-banner text-center rounded-4 px-3 py-5 mb-5" aria-labelledby="news-title">
      <h1 id="news-title" class="news-banner-title">Cẩm nang làm đẹp</h1>

      <p class="news-banner-description mb-4">Hiểu làn da, chọn đúng sản phẩm, đẹp theo cách của bạn.</p>

      <!-- Ô tìm kiếm -->
      <form id="news-search-form" class="news-search mx-auto" role="search" aria-label="Tìm kiếm bài viết">
        <label for="news-search-input" class="visually-hidden">Nhập từ khóa tìm bài viết</label>

        <div class="input-group">
          <input type="search" id="news-search-input" name="keyword" class="form-control"
            placeholder="Tìm bài viết: dưỡng da, makeup, chăm sóc tóc..." autocomplete="off" aria-controls="news-list">

          <button type="submit" class="btn news-search-button">Tìm kiếm</button>
        </div>
      </form>

      <div class="news-filters d-flex flex-wrap justify-content-center gap-2 mt-4" role="group"
        aria-label="Lọc bài viết theo chủ đề">

        <button type="button" class="btn news-filter news-filter-all active" data-category="all" aria-pressed="true"
          aria-controls="news-list">Tất cả</button>

        <button type="button" class="btn news-filter news-filter-skincare" data-category="skincare" aria-pressed="false"
          aria-controls="news-list">Chăm sóc da</button>

        <button type="button" class="btn news-filter news-filter-makeup" data-category="makeup" aria-pressed="false"
          aria-controls="news-list">Trang điểm</button>

        <button type="button" class="btn news-filter news-filter-body" data-category="body" aria-pressed="false"
          aria-controls="news-list">Chăm sóc cơ thể</button>

        <button type="button" class="btn news-filter news-filter-hair" data-category="hair" aria-pressed="false"
          aria-controls="news-list">Chăm sóc tóc</button>
      </div>
    </section>

    <!-- Danh sách bài viết -->
    <section class="news-articles" aria-labelledby="news-list-title" data-page-size="12">

      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4">
        <h2 id="news-list-title" class="news-section-title mb-0">Khám phá bí quyết làm đẹp</h2>

        <p id="news-result-count" class="news-result-count mb-0" role="status" aria-live="polite" aria-atomic="true">
        </p>
      </div>

      <div id="news-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      </div>

      <!-- Không có kết quả -->
      <div id="news-empty" class="news-empty text-center rounded-4 p-4 p-md-5" role="alert" hidden>
        <h3 class="h5 mb-2">Không tìm thấy bài viết phù hợp</h3>
        <p class="mb-3">
          Bạn thử từ khóa khác hoặc chọn một chủ đề khác nhé.
        </p>

        <button type="button" id="news-reset" class="btn news-reset-button">Xem tất cả bài viết</button>
      </div>

      <!-- Phân trang được news.js tạo theo số bài sau khi lọc -->
      <nav id="news-pagination-nav" class="mt-4" aria-label="Phân trang bài viết" hidden>
        <ul id="news-pagination" class="pagination justify-content-center flex-wrap gap-2 mb-2"></ul>
      </nav>

    </section>
  </main>

  <!-- Footer dùng chung do A phụ trách -->
  <div id="site-footer"></div>

  <script src="assets/vendor/jquery/jquery-3.7.1.min.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/data/news.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/news.js"></script>
</body>

</html>
