<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng | Beauty N Beat</title>

  <!-- Thứ tự nạp CSS: Bootstrap -> common -> cart -->
  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="container py-4">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb small">
        <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Giỏ hàng</li>
      </ol>
    </nav>

    <h1 class="page-heading mb-4">Giỏ hàng của bạn</h1>

    <div class="row">
      <!-- Cột danh sách món hàng -->
      <div class="col-lg-8">
        <div id="cart-container" class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">

            <!-- Trạng thái giỏ rỗng -->
            <div id="empty-cart-view" class="text-center py-5 d-none">
              <div class="mb-3 fs-1">🛍️</div>
              <h5 class="fw-bold">Giỏ hàng đang trống!</h5>
              <p class="text-muted">Bạn chưa chọn bất kỳ sản phẩm mỹ phẩm nào.</p>
              <a href="products.html" class="btn btn-custom-primary mt-2">Tiếp tục mua sắm</a>
            </div>

            <!-- Bảng danh sách sản phẩm khi có hàng -->
            <div id="filled-cart-view" class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr class="table-light">
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th class="col-qty">Số lượng</th>
                    <th>Thành tiền</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="cart-table-body">
                  <!-- Dữ liệu render bằng JS -->
                </tbody>
              </table>
            </div>

          </div>
        </div>
      </div>

      <!-- Cột tóm tắt thành tiền -->
      <div class="col-lg-4">
        <div class="card shadow-sm border-0 summary-box p-3">
          <h5 class="fw-bold mb-3 border-bottom pb-2">Tóm tắt đơn hàng</h5>
          <div class="d-flex justify-content-between mb-2">
            <span>Tạm tính:</span>
            <span id="subtotal-price" class="fw-semibold">0 đ</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span>Phí vận chuyển:</span>
            <span class="text-success fw-semibold">Miễn phí</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-4">
            <span class="fs-5 fw-bold">Tổng tiền:</span>
            <span id="total-price" class="fs-4 fw-bold text-sale">0 đ</span>
          </div>
          <a href="checkout.html" id="btn-proceed-checkout" class="btn btn-custom-primary w-100 py-2 fs-5">Tiến hành thanh toán</a>
          <a href="products.html" class="btn btn-link w-100 text-center mt-2 text-decoration-none text-muted">← Tiếp tục xem sản phẩm</a>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <!-- Thứ tự nạp: Bootstrap -> dữ liệu -> common -> cart (không dùng jQuery) -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/data/products.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/cart.js"></script>
</body>
</html>
